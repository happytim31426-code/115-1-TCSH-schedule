<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="臺南慈濟高中 115 學年度第 1 學期課表查詢" />
    <title>115-1 課表查詢｜臺南慈濟高中</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="hero">
      <p class="eyebrow">臺南慈濟高中</p>
      <h1>115 學年度第 1 學期課表</h1>
      <p>實施期間：115.08.31 - 116.01.20</p>
      <button class="theme-toggle" id="theme-toggle" type="button">夜間閱讀</button>
    </header>

    <main class="page-shell">
      <section class="controls" aria-label="課表查詢">
        <div class="control-group">
          <label for="view-type">查詢類型</label>
          <select id="view-type">
            <option value="class">班級課表</option>
            <option value="teacher">教師課表</option>
            <option value="swap">代調課</option>
            <option value="recruit">可招生教師</option>
          </select>
        </div>
        <div class="control-group grow" id="schedule-picker-group">
          <label for="schedule-select" id="schedule-select-label">選擇班級</label>
          <select id="schedule-select"></select>
        </div>
      </section>

      <section class="tool-card is-hidden" id="swap-tool">
        <h2>代調課</h2>
        <p>選擇原授課教師、時段與班級，系統會列出可交換的授課教師與其可調課時段。</p>
        <div class="tool-grid">
          <label>調課教師<select id="swap-teacher"></select></label>
          <label>調課班級<select id="swap-class"></select></label>
          <label>調課星期<select id="swap-day"></select></label>
          <label>調課節次<select id="swap-period"></select></label>
        </div>
        <div class="tool-results" id="swap-results"></div>
        <div class="comparison-grid" aria-live="polite">
          <section id="swap-left" class="comparison-panel"></section>
          <section id="swap-middle" class="comparison-panel"></section>
          <section id="swap-right" class="comparison-panel">點選候選教師後，在此顯示課表。</section>
        </div>
      </section>

      <section class="tool-card is-hidden" id="recruit-tool">
        <h2>可招生教師清單</h2>
        <p>先選星期與學校，再點推薦人員加入該校；點已選姓名可移回推薦清單。需求人數包含一位帶隊老師。</p>
        <div class="tool-grid recruit-filters"><label>星期<select id="recruit-day"></select></label><label>該天入班學校數<select id="school-count"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label></div>
        <div id="recruit-roster" aria-live="polite"></div>
        <p id="recruit-message" role="status"></p>
        <div id="school-plans" class="school-plans"></div>
      </section>

      <section class="schedule-card" id="schedule-card" aria-live="polite">
        <div class="schedule-heading">
          <div>
            <p class="eyebrow" id="schedule-kind">班級課表</p>
            <h2 id="schedule-title"></h2>
          </div>
          <p id="schedule-meta"></p>
        </div>
        <div class="table-wrap">
          <table id="schedule-table">
            <thead>
              <tr><th scope="col">節次／時間</th><th scope="col">一</th><th scope="col">二</th><th scope="col">三</th><th scope="col">四</th><th scope="col">五</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

    </main>
    <footer>資料來源：臺南慈濟高中 115 學年度第 1 學期課程表</footer>
    <script src="data/schedules.js"></script>
    <script src="js/app.js"></script>
    <script src="js/recruit.js"></script>
  </body>
</html>
